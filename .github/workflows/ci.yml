name: CI

# Intégration continue Bobine : à chaque push sur main et à chaque pull request,
# on vérifie que le frontend Next.js se construit et que le backend Python est
# syntaxiquement valide avec ses dépendances résolues. Volontairement léger et
# fiable (pas de service externe) pour un statut vert stable ; la suite de tests
# pytest (qui requiert Redis) pourra être ajoutée en tant que job séparé.

on:
  push:
    branches: [main]
  pull_request:

# Annule les exécutions précédentes encore en cours sur la même référence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build

  backend:
    name: Backend checks (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Syntax check (compile all sources)
        run: python -m compileall -q backend/app scripts

  assistant-core:
    name: Assistant core (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            assistant/target
          key: cargo-${{ runner.os }}-${{ hashFiles('assistant/**/Cargo.toml', 'assistant/Cargo.lock') }}
      - name: Clippy (warnings = erreurs)
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  install-script:
    name: install.sh sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérification de syntaxe bash
        run: bash -n install.sh
      - name: Le compteur d'étapes STEP_TOTAL reflète le nombre d'appels à step()
        run: |
          declared=$(grep -oE '^STEP_TOTAL=[0-9]+' install.sh | head -1 | cut -d= -f2)
          actual=$(grep -cE '^[[:space:]]*step ' install.sh)
          echo "STEP_TOTAL=${declared} ; appels step()=${actual}"
          test "${declared}" = "${actual}"
